[package]
name = "omp-desktop"
version = "0.4.1"
description = "Cross-platform desktop client for Oh My Pi"
authors = ["OMP Desktop contributors"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
updater-e2e = []

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "omp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
base64 = "0.22"
portable-pty = "0.9.0"
time = { version = "0.3.53", features = ["formatting", "parsing"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "0.0.29", default-features = false, features = ["deserialize"] }
semver = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4.1.5", default-features = false, features = ["v1", "windows-native-keyring-store"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4.1.5", default-features = false, features = ["v1", "zbus-secret-service-keyring-store"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.1.5", default-features = false, features = ["v1", "apple-native-keyring-store"] }
