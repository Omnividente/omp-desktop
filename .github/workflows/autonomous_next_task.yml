name: Autonomous Next Task
run-name: ${{ inputs.continuation_key != '' && format('Next {0}', inputs.continuation_key) || 'Autonomous Next Task' }}

# The trusted controller reads code from main, product from lab and mutable
# metadata from autonomous/state. Research and explicitly selected implementation
# use separate lanes; pending proposals never occupy either lane.
# Autonomous Continue owns scheduled cadence; manual dispatch intentionally polls now.
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Optional approved proposal to implement, research task, or report to recover
        type: string
        default: ""
      recover_report:
        description: Owner-only recovery; disposed research reparses only its exact saved report
        type: boolean
        default: false
      repair_after:
        description: Optional exact failed report_repair.at authorizing one new same-session format request
        type: string
        default: ""
      focus:
        description: Comma-separated focus filter
        type: string
        default: ""
      risk_ceiling:
        description: Highest risk of a proposed change
        type: choice
        options: [low, medium, high]
        default: medium
      automatic:
        description: Recheck the due time before a research-only automatic tick
        type: boolean
        default: false
      continuation_key:
        description: Correlation key for an automatic handoff
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  dispatch:
    name: Research and collect proposals without accepting them
    if: ${{ github.ref == 'refs/heads/main' && (vars.JULES_LOOP_ENABLED == 'true' || inputs.recover_report == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: autonomous-lab-queue
      queue: max
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.PAT || secrets.GH_TOKEN }}
    steps:
      - name: Check out the trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: control
          persist-credentials: false

      - name: Check out the product history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: autonomous/lab
          fetch-depth: 0
          path: lab
          persist-credentials: false

      - name: Verify the laboratory policy
        run: python3 control/scripts/autonomous/verify_policy.py --config control/autonomous-project.json --integration-branch autonomous/lab

      - name: Reconcile saved attempts and run one laboratory tick
        env:
          TASK_ID: ${{ inputs.task_id }}
          FOCUS: ${{ inputs.focus }}
          RISK_CEILING: ${{ inputs.risk_ceiling }}
          RECOVER_REPORT: ${{ inputs.recover_report }}
          REPAIR_AFTER: ${{ inputs.repair_after }}
          RECOVERY_ACTOR: ${{ github.actor }}
          AUTOMATIC: ${{ inputs.automatic }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          JULES_API_KEY_BACKUP: ${{ secrets.JULES_API_KEY_BACKUP }}
        run: |
          set -euo pipefail
          options=()
          if [ "${RECOVER_REPORT}" = true ]; then options+=(--recover-report); fi
          if [ -n "${REPAIR_AFTER}" ]; then options+=(--repair-after "${REPAIR_AFTER}"); fi
          if [ "${AUTOMATIC}" = true ]; then options+=(--automatic); fi
          python3 control/scripts/autonomous/lab_controller.py \
            --repo lab --config control/autonomous-project.json \
            --manifest queue.json --revision-file queue-revision.json \
            --task-id "${TASK_ID}" --focus "${FOCUS}" --actor "${RECOVERY_ACTOR}" \
            --risk-ceiling "${RISK_CEILING:-medium}" --run-id "${GITHUB_RUN_ID}" \
            --out lab-result.json "${options[@]}"

      - name: Preserve laboratory outcome and redacted report diagnostics
        if: ${{ always() && (hashFiles('lab-result.json') != '' || hashFiles('research-diagnostics/*.json') != '') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: laboratory-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            lab-result.json
            research-diagnostics/*.json
          retention-days: 14
          if-no-files-found: error

  handoff:
    needs: dispatch
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.dispatch.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ secrets.PAT || secrets.GH_TOKEN }}
    steps:
      - name: Check out the trusted continuation controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: control
          persist-credentials: false
      - name: Hand off outside the queue writer lock
        run: >-
          python3 control/scripts/autonomous/continue_loop.py
          --repo control --config control/autonomous-project.json
          --handoff --out continuation-result.json
      - name: Retain observed handoff
        if: ${{ always() && hashFiles('continuation-result.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tick-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: continuation-result.json
          retention-days: 14
          if-no-files-found: error
