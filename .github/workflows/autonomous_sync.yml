name: Autonomous Sync Main
run-name: Sync main ${{ inputs.main_sha || github.sha }} ${{ inputs.continuation_key }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      main_sha:
        description: Expected current main SHA (optional for external admission)
        type: string
        default: ""
      lab_sha:
        description: Expected current autonomous/lab SHA (optional for external admission)
        type: string
        default: ""
      continuation_key:
        description: Immutable durable dispatch correlation
        type: string
        default: ""
      control_sha:
        description: Frozen trusted controller revision for an internal dispatch
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read

# Keep the one running/one pending keyed chain separate from coalescible push
# and manual ingress. Neither lane grants execution without journal admission.
concurrency:
  group: >-
    ${{ github.ref == 'refs/heads/main' &&
        (github.event_name == 'workflow_dispatch' && inputs.continuation_key != '' &&
         'autonomous-lab-sync-chain' || 'autonomous-lab-sync-ingress') ||
        format('autonomous-lab-sync-ignored-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  CONTROL_SHA: ${{ github.sha }}
  CONTINUATION_KEY: ${{ inputs.continuation_key }}

jobs:
  prepare:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      status: ${{ steps.result.outputs.status }}
      candidate_sha: ${{ steps.result.outputs.candidate_sha }}
    env:
      GH_TOKEN: ${{ secrets.PAT || secrets.GH_TOKEN }}
      EXPECTED_MAIN: ${{ inputs.main_sha || github.sha }}
      EXPECTED_LAB: ${{ inputs.lab_sha }}
      CANDIDATE_BRANCH: autonomous/sync-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the pinned trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: control
          persist-credentials: false
      - name: Authenticate the frozen preparation controller
        id: control_pin
        run: >-
          python3 control/scripts/autonomous/workflow_admission.py
          --repo control --config control/autonomous-project.json
          --workflow autonomous_sync.yml
      - name: Check out the authenticated preparation revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.control_pin.outputs.control_sha }}
          path: control
          persist-credentials: false
      - name: Check out integration history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: autonomous/lab
          fetch-depth: 0
          path: lab
          persist-credentials: false
      - name: Pin heads and admit one preparation executor
        run: |
          set -euo pipefail
          git -C lab fetch origin main autonomous/lab
          main=$(git -C lab rev-parse refs/remotes/origin/main)
          lab=$(git -C lab rev-parse refs/remotes/origin/autonomous/lab)
          test "${main}" = "${EXPECTED_MAIN}"
          if [ -n "${EXPECTED_LAB}" ]; then test "${lab}" = "${EXPECTED_LAB}"; fi
          test "$(git -C lab rev-parse HEAD)" = "${lab}"
          printf '[]\n' > pull-requests.json
          python3 control/scripts/autonomous/verify_policy.py --config control/autonomous-project.json --integration-branch autonomous/lab
          python3 control/scripts/autonomous/sync_main.py --action prepare --repo lab \
            --main-sha "${main}" --lab-sha "${lab}" --candidate-branch "${CANDIDATE_BRANCH}" \
            --manifest queue.json --state-revision queue-revision.json \
            --pull-requests pull-requests.json --config control/autonomous-project.json --out sync-preparation.json
      - name: Export preparation reference
        id: result
        if: ${{ always() && hashFiles('sync-preparation.json') != '' }}
        run: |
          jq -r 'to_entries[] | select(.key == "status" or .key == "candidate_sha") | "\(.key)=\(.value)"' sync-preparation.json >> "${GITHUB_OUTPUT}"
      - name: Preserve preparation reference (not an execution capability)
        if: ${{ always() && hashFiles('sync-preparation.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autonomous-sync-preparation-${{ github.run_attempt }}
          path: sync-preparation.json
          if-no-files-found: error
          retention-days: 14

  checks:
    needs: prepare
    if: ${{ needs.prepare.outputs.status == 'prepared' }}
    permissions:
      contents: read
    uses: ./.github/workflows/pr.yml
    with:
      ref: ${{ needs.prepare.outputs.candidate_sha }}

  finalize:
    needs: [prepare, checks]
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.prepare.outputs.status != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.PAT || secrets.GH_TOKEN }}
      GATES: ${{ needs.checks.result }}
    steps:
      - name: Recover preparation reference
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: autonomous-sync-preparation-${{ github.run_attempt }}
      - name: Check out the same pinned trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: control
          persist-credentials: false
      - name: Authenticate the original finalization controller
        id: control_pin
        run: >-
          python3 control/scripts/autonomous/workflow_admission.py
          --repo control --config control/autonomous-project.json
          --workflow autonomous_sync.yml
      - name: Check out the authenticated finalization revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.control_pin.outputs.control_sha }}
          fetch-depth: 0
          path: control
          persist-credentials: false
      - name: Retain a terminal preparation or publish one checked finalization
        run: |
          set -euo pipefail
          python3 control/scripts/autonomous/sync_main.py --action finalize --repo control \
            --manifest queue.json --state-revision queue-revision.json --config control/autonomous-project.json \
            --preparation sync-preparation.json --gates "${GATES}" --out sync-result.json
      - name: Preserve final outcome
        if: ${{ always() && hashFiles('sync-result.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autonomous-sync-result-${{ github.run_attempt }}
          path: sync-result.json
          if-no-files-found: error
          retention-days: 14

  handoff:
    needs: [prepare, finalize]
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.prepare.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ secrets.PAT || secrets.GH_TOKEN }}
    steps:
      - name: Check out the pinned continuation controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: control
          persist-credentials: false
      - name: Handoff only from the original durable publication receipt
        run: >-
          python3 control/scripts/autonomous/continue_loop.py
          --repo control --config control/autonomous-project.json
          --handoff --source-workflow autonomous_sync.yml --out continuation-result.json
      - name: Retain observed handoff
        if: ${{ always() && hashFiles('continuation-result.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sync-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: continuation-result.json
          retention-days: 14
          if-no-files-found: error
