name: Autonomous Replenish

# Diagnostics execute product code without the state writer's credential.
# A separate trusted job imports data and commits only autonomous/state.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    name: Collect real product diagnostics without write credentials
    if: ${{ github.ref == 'refs/heads/main' && vars.JULES_LOOP_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      code_sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: autonomous/lab
          path: lab
          persist-credentials: false

      - name: Pin the inspected code
        id: revision
        run: echo "sha=$(git -C lab rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lab/package-lock.json

      - name: Install frontend dependencies
        working-directory: lab
        run: npm ci

      - name: Collect ESLint diagnostics
        working-directory: lab
        run: npx eslint src --format json --output-file eslint-report.json || true

      - name: Collect TypeScript diagnostics
        working-directory: lab
        run: npm run typecheck > tsc-report.log 2>&1 || true

      - name: Make diagnostic paths repository-relative
        run: |
          set -euo pipefail
          if [ -f lab/eslint-report.json ]; then
            sed -i "s#${GITHUB_WORKSPACE}/lab/##g" lab/eslint-report.json
          fi

      - name: Transfer diagnostic data only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autonomous-diagnostics-${{ github.run_attempt }}
          path: |
            lab/eslint-report.json
            lab/tsc-report.log
          retention-days: 1
          if-no-files-found: error

  replenish:
    name: Import diagnostics into the authoritative queue
    needs: diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: autonomous-lab-queue
      queue: max
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.PAT || secrets.GH_TOKEN }}
      CODE_SHA: ${{ needs.diagnostics.outputs.code_sha }}
    steps:
      - name: Check out the trusted control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: control
          persist-credentials: false

      - name: Check out the migration seed without running product code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: autonomous/lab
          path: lab
          persist-credentials: false

      - name: Read diagnostics from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: autonomous-diagnostics-${{ github.run_attempt }}
          path: diagnostics

      - name: Append and save evidence-backed tasks without moving lab
        run: |
          set -euo pipefail
          if [ "$(gh variable get JULES_LOOP_ENABLED --repo "${GITHUB_REPOSITORY}")" != true ]; then exit 0; fi
          if [ "$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/autonomous/lab" --jq '.object.sha')" != "${CODE_SHA}" ]; then
            echo 'Product moved since diagnostics; no stale findings were imported.' >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          python3 control/scripts/autonomous/verify_policy.py --config control/autonomous-project.json --integration-branch autonomous/lab
          python3 control/scripts/autonomous/state_store.py --action load --repo lab --manifest queue.json --revision-file queue-revision.json
          python3 control/scripts/autonomous/replenish_tasks.py --manifest queue.json --eslint-json diagnostics/eslint-report.json --tsc-log diagnostics/tsc-report.log --base-commit "${CODE_SHA}" --max-new 10
          python3 control/scripts/autonomous/validate_tasks.py queue.json
          if [ "$(gh variable get JULES_LOOP_ENABLED --repo "${GITHUB_REPOSITORY}")" != true ]; then exit 0; fi
          python3 control/scripts/autonomous/state_store.py --action save --repo lab --manifest queue.json --revision-file queue-revision.json
          {
            echo '### Task queue replenished'
            python3 control/scripts/autonomous/select_task.py --manifest queue.json --json
          } >> "${GITHUB_STEP_SUMMARY}"
