name: Verify Production Installer State

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact immutable production v0.9.13 source commit (independent of harness_sha)
        required: true
        type: string
      target_release_id:
        description: Exact published immutable v0.9.13 prerelease ID
        required: true
        type: string
      target_run_id:
        description: Successful production release-artifacts.yml push run ID for that commit
        required: true
        type: string
      harness_sha:
        description: Exact signed acceptance harness commit (dispatch at that same ref)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-install-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  windows-production-install:
    name: Production normal NSIS ${{ matrix.scenario }} startup/state (Windows Server 2022)
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario: [clean, upgrade]
    env:
      PRODUCTION_HARNESS_SHA: ${{ inputs.harness_sha }}
      PRODUCTION_TARGET_SHA: ${{ inputs.target_sha }}
      PRODUCTION_TARGET_RELEASE_ID: ${{ inputs.target_release_id }}
      PRODUCTION_TARGET_RUN_ID: ${{ inputs.target_run_id }}
    steps:
      - name: Require exact independent harness and production identities
        shell: pwsh
        env:
          WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
          WORKFLOW_SOURCE_REF: ${{ github.workflow_ref }}
          SCENARIO: ${{ matrix.scenario }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -cne 'Omnividente/omp-desktop' -or
              $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or
              $env:PRODUCTION_TARGET_SHA -cnotmatch '^[0-9a-f]{40}$' -or
              $env:PRODUCTION_HARNESS_SHA -cnotmatch '^[0-9a-f]{40}$' -or
              $env:PRODUCTION_TARGET_RELEASE_ID -cnotmatch '^[1-9][0-9]*$' -or
              $env:PRODUCTION_TARGET_RUN_ID -cnotmatch '^[1-9][0-9]*$' -or
              $env:GITHUB_SHA -cne $env:PRODUCTION_HARNESS_SHA -or
              $env:WORKFLOW_SOURCE_SHA -cne $env:PRODUCTION_HARNESS_SHA -or
              -not $env:WORKFLOW_SOURCE_REF.StartsWith('Omnividente/omp-desktop/.github/workflows/production-install-smoke.yml@')) {
            throw 'Dispatch/workflow source must match harness_sha; production target is independently pinned.'
          }
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows') {
            throw 'Production installers require a fresh GitHub-hosted Windows VM.'
          }
          $signature = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:PRODUCTION_HARNESS_SHA" --jq '.commit.verification | {verified, reason}' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $signature.verified -ne $true -or $signature.reason -cne 'valid') {
            throw 'Acceptance harness source must have a verified signature.'
          }
          $root = Join-Path $env:RUNNER_TEMP "production-install-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:SCENARIO"
          "PRODUCTION_WORK_DIR=$root/downloads" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PRODUCTION_EVIDENCE_DIR=$root/evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out exact production target source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: production-target

      - name: Check out exact signed acceptance harness source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.harness_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: acceptance-harness

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download and verify every immutable production asset
        id: acquire
        # Read-only API token is limited to identity/acquisition steps, never installers.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ../acceptance-harness/.github/scripts/prepare-production-assets.mjs
        working-directory: production-target

      - name: Record public workflow and source labels
        shell: pwsh
        env:
          WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
          WORKFLOW_SOURCE_REF: ${{ github.workflow_ref }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          $ErrorActionPreference = 'Stop'
          @{
            repository = $env:GITHUB_REPOSITORY
            checkoutSha = $env:PRODUCTION_TARGET_SHA
            harnessCheckoutSha = $env:PRODUCTION_HARNESS_SHA
            harnessScriptSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'acceptance-harness/.github/scripts/run-production-windows-smoke.mjs')).Hash.ToLowerInvariant()
            dispatchSha = $env:GITHUB_SHA
            workflowSha = $env:WORKFLOW_SOURCE_SHA
            workflowRef = $env:WORKFLOW_SOURCE_REF
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            scenario = $env:SCENARIO
            runner = 'windows-2022 (Windows Server, not consumer Windows 11 coverage)'
            resultKind = $(if ($env:SCENARIO -ceq 'clean') { 'production-normal-nsis-clean-startup' } else { 'production-normal-nsis-upgrade-state' })
            builtInUpdater = 'Separate production-updater-smoke gate: stable-only stays12; explicit prerelease opt-in discovers13. NSIS replacement is actual shipped12 upgrade, not PROBE.'
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath "$env:PRODUCTION_EVIDENCE_DIR/workflow-source.json" -Encoding utf8NoBOM

      - name: Exercise real production normal NSIS startup and persistence
        env:
          PRODUCTION_RECEIPT: ${{ runner.temp }}/production-install-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.scenario }}/evidence/verified-production-assets.json
          PRODUCTION_SCENARIO: ${{ matrix.scenario }}
          PRODUCTION_SMOKE_WORK_DIR: ${{ runner.temp }}/production-install-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.scenario }}/scenario
        # The Windows helper also allowlists each native child environment. No signing,
        # provider, environment, Git checkout or GH_TOKEN credentials are supplied here.
        working-directory: production-target
        run: node ../acceptance-harness/.github/scripts/run-production-windows-smoke.mjs

      - name: Recheck immutable metadata and every asset before final acceptance
        if: ${{ !cancelled() && steps.acquire.outcome == 'success' }}
        # Public metadata only; deliberately no GH_TOKEN in this post-install step.
        run: node ../acceptance-harness/.github/scripts/prepare-production-assets.mjs --recheck
        working-directory: production-target

      - name: Upload small production installer evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-normal-nsis-${{ matrix.scenario }}-proofs
          path: |
            ${{ env.PRODUCTION_EVIDENCE_DIR }}/**/*.json
            ${{ env.PRODUCTION_EVIDENCE_DIR }}/**/*.png
          if-no-files-found: warn
          retention-days: 3
          # Downloads, installed binaries, synthetic profiles/session roots and full
          # DOM/user logs are outside this directory and must never be uploaded.

  linux-production-install:
    name: Production normal AppImage replacement native UI and state (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      PRODUCTION_HARNESS_SHA: ${{ inputs.harness_sha }}
      PRODUCTION_TARGET_SHA: ${{ inputs.target_sha }}
      PRODUCTION_TARGET_RELEASE_ID: ${{ inputs.target_release_id }}
      PRODUCTION_TARGET_RUN_ID: ${{ inputs.target_run_id }}
      PRODUCTION_NATIVE_MODE: normal
      PRODUCTION_NATIVE_PYTHON: /usr/bin/python3
      PRODUCTION_NATIVE_TESSERACT: /usr/bin/tesseract
    steps:
      - name: Admit exact independent signed harness on fresh hosted Linux VM
        shell: bash
        env:
          WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
          WORKFLOW_SOURCE_REF: ${{ github.workflow_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == Omnividente/omp-desktop && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux ]]
          [[ "$PRODUCTION_TARGET_SHA" =~ ^[0-9a-f]{40}$ && "$PRODUCTION_HARNESS_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PRODUCTION_TARGET_RELEASE_ID" =~ ^[1-9][0-9]*$ && "$PRODUCTION_TARGET_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_SHA" == "$PRODUCTION_HARNESS_SHA" && "$WORKFLOW_SOURCE_SHA" == "$PRODUCTION_HARNESS_SHA" ]]
          [[ "$WORKFLOW_SOURCE_REF" == Omnividente/omp-desktop/.github/workflows/production-install-smoke.yml@* ]]
          signature=$(gh api "repos/$GITHUB_REPOSITORY/commits/$PRODUCTION_HARNESS_SHA" --jq '.commit.verification | .verified == true and .reason == "valid"')
          [[ "$signature" == true ]]
          root="$RUNNER_TEMP/production-appimage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "PRODUCTION_WORK_DIR=$root/downloads" >> "$GITHUB_ENV"
          echo "PRODUCTION_EVIDENCE_DIR=$root/evidence" >> "$GITHUB_ENV"
          echo "PRODUCTION_SMOKE_WORK_DIR=$root/scenario" >> "$GITHUB_ENV"
      - name: Check out exact immutable production target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: production-target
      - name: Check out exact signed acceptance harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.harness_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: acceptance-harness
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Acquire all immutable production assets with unchanged cryptographic verifier
        id: acquire
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: production-target
        run: node ../acceptance-harness/.github/scripts/prepare-production-assets.mjs
      - name: Install actual native runtime and accessibility dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-0 libayatana-appindicator3-1 librsvg2-2 libfuse2 xvfb xauth dbus-x11 at-spi2-core libatk-adaptor python3-pyatspi python3-pil xdotool wmctrl openbox imagemagick tesseract-ocr fonts-noto-cjk
          tesseract --version
      - name: Exercise candidate first launch official OMP setup then separate shipped12 AppImage state replacement
        working-directory: production-target
        env:
          PRODUCTION_RECEIPT: ${{ env.PRODUCTION_EVIDENCE_DIR }}/verified-production-assets.json
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1600x1000x24' dbus-run-session -- bash -euc '
            openbox >/dev/null 2>&1 &
            node ../acceptance-harness/.github/scripts/run-production-native-smoke.mjs
          '
      - name: Recheck frozen metadata and every immutable asset after native scenario
        if: ${{ !cancelled() && steps.acquire.outcome == 'success' }}
        working-directory: production-target
        run: node ../acceptance-harness/.github/scripts/prepare-production-assets.mjs --recheck
      - name: Upload bounded synthetic native Linux proofs only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-normal-appimage-proof
          path: |
            ${{ env.PRODUCTION_EVIDENCE_DIR }}/*.json
            ${{ env.PRODUCTION_EVIDENCE_DIR }}/*.png
          if-no-files-found: warn
          retention-days: 3
