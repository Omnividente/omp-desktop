name: Autonomous Recover Reserved Dispatch

# Bind the authenticated original session by one target-only CAS, never create/retry/handoff.
on:
  workflow_dispatch:
    inputs:
      expected_state_sha:
        description: Exact reviewed autonomous/state SHA containing the original reserved attempt
        type: string
        required: true
      decision_id:
        description: Original automatic NEXT with its authentic failed-save native checkpoint
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
        'autonomous-lab-queue' || format('autonomous-dispatch-binding-ignored-{0}', github.run_id) }}
  queue: max
  cancel-in-progress: false

jobs:
  bind:
    name: Bind only the original reserved research session
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.PAT || secrets.GH_TOKEN }}
      CONTROL_SHA: ${{ github.sha }}
      CONTINUATION_KEY: ""
      EXPECTED_STATE_SHA: ${{ inputs.expected_state_sha }}
      DECISION_ID: ${{ inputs.decision_id }}
    steps:
      - name: Check out the full checked event-main control revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: control
          persist-credentials: false

      - name: Reobserve the original session and bind exactly two target execution fields by CAS
        shell: bash
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          JULES_API_KEY_BACKUP: ${{ secrets.JULES_API_KEY_BACKUP }}
        run: |
          set -euo pipefail
          python3 control/scripts/autonomous/recover_delivery.py \
            --operation dispatch_binding \
            --repo control --config control/autonomous-project.json \
            --manifest queue.json --revision-file queue-revision.json \
            --expected-state-sha "${EXPECTED_STATE_SHA}" --decision-id "${DECISION_ID}" \
            --out owner-dispatch-binding-result.json

      - name: Retain acknowledged receipt whitelist or safe blocked outcome
        if: ${{ always() && hashFiles('owner-dispatch-binding-result.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owner-dispatch-binding-${{ github.run_id }}-${{ github.run_attempt }}
          path: owner-dispatch-binding-result.json
          retention-days: 30
          if-no-files-found: error
