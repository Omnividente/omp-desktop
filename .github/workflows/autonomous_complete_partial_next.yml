name: Autonomous Complete Partial NEXT Checkpoint

# Observe only the supported original partial controller failure. External effects
# are NOT presumed absent. No retry, dispatch, task/ref mutation, switch or Sync.
on:
  workflow_dispatch:
    inputs:
      expected_state_sha:
        description: Exact independently reviewed native partial autonomous/state SHA
        type: string
        required: true
      decision_id:
        description: Original consumed automatic NEXT with authenticated failed native artifact
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
        'autonomous-lab-queue' || format('autonomous-partial-next-ignored-{0}', github.run_id) }}
  queue: max
  cancel-in-progress: false

jobs:
  complete:
    name: Observe one owner-selected original partial controller failure
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.PAT || secrets.GH_TOKEN }}
      CONTROL_SHA: ${{ github.sha }}
      CONTINUATION_KEY: ""
      EXPECTED_STATE_SHA: ${{ inputs.expected_state_sha }}
      DECISION_ID: ${{ inputs.decision_id }}
    steps:
      - name: Check out the full checked event-main control revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          filter: blob:none
          fetch-depth: 0
          path: control
          persist-credentials: false

      - name: Observe only the partial failure by one owner-bound state CAS
        shell: bash
        run: |
          set -euo pipefail
          python3 control/scripts/autonomous/recover_delivery.py \
            --operation partial_next_checkpoint \
            --repo control --config control/autonomous-project.json \
            --manifest queue.json --revision-file queue-revision.json \
            --expected-state-sha "${EXPECTED_STATE_SHA}" --decision-id "${DECISION_ID}" \
            --out owner-partial-next-checkpoint-result.json

      - name: Observe planned identity without creating or retiring anything
        shell: bash
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          JULES_API_KEY_BACKUP: ${{ secrets.JULES_API_KEY_BACKUP }}
        run: |
          set -euo pipefail
          python3 control/scripts/autonomous/planned_dispatch_observation.py \
            --manifest queue.json --revision-file queue-revision.json \
            --expected-state-sha "${EXPECTED_STATE_SHA}" --decision-id "${DECISION_ID}" \
            --repository "${GITHUB_REPOSITORY}" --out planned-dispatch-observation.json

      - name: Retain closure and independent read-only observation outcomes
        if: ${{ always() && (hashFiles('owner-partial-next-checkpoint-result.json') != '' || hashFiles('planned-dispatch-observation.json') != '') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owner-partial-next-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            owner-partial-next-checkpoint-result.json
            planned-dispatch-observation.json
          retention-days: 30
          if-no-files-found: error
