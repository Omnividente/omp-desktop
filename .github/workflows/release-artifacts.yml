name: Build and Publish Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality gate for release SHA
    uses: ./.github/workflows/pr.yml

  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Require tagged commit on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit reachable from main." >&2
            exit 1
          fi

      - name: Require matching semantic versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from "node:fs/promises";
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/;
          const tag = process.env.RELEASE_TAG ?? "";
          const version = tag.startsWith("v") ? tag.slice(1) : "";
          const packageManifest = JSON.parse(await readFile("package.json", "utf8"));
          const tauriConfig = JSON.parse(await readFile("src-tauri/tauri.conf.json", "utf8"));
          const cargoManifest = await readFile("src-tauri/Cargo.toml", "utf8");
          const cargoVersion = cargoManifest.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          if (!semver.test(version)) throw new Error(`Release tag ${tag} is not semantic.`);
          if (packageManifest.version !== version || tauriConfig.version !== version || cargoVersion !== version) {
            throw new Error(`Tag ${tag} must match package.json, tauri.conf.json, and Cargo.toml.`);
          }
          EOF

  publish:
    name: Build and upload (${{ matrix.platform }})
    needs:
      - quality-gate
      - validate-tag
    permissions:
      contents: write
    environment: production-release
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-22.04
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            file

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify production updater signing secret
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.PRODUCTION_TAURI_SIGNING_PRIVATE_KEY }}
        run: node -e "if (!process.env.TAURI_SIGNING_PRIVATE_KEY?.trim()) throw new Error('PRODUCTION_TAURI_SIGNING_PRIVATE_KEY is required in the production-release environment');"

      - name: Build, sign, and upload Tauri artifacts
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.PRODUCTION_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.PRODUCTION_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: OMP Desktop v__VERSION__
          releaseBody: "Установщики и signed updater-артефакты OMP Desktop."
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: true

      - name: Create and upload Linux checksums
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          mapfile -d '' files < <(find src-tauri/target/release/bundle -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print0 | sort -z)
          ((${#files[@]} > 0))
          sha256sum "${files[@]}" > src-tauri/target/release/SHA256SUMS-linux.txt
          gh release upload "v${version}" src-tauri/target/release/SHA256SUMS-linux.txt --clobber

      - name: Create and upload Windows checksums
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $bundleRoot = Join-Path $PWD 'src-tauri/target/release/bundle'
          $files = @(Get-ChildItem -Path $bundleRoot -Recurse -File | Where-Object { $_.Extension -in '.msi', '.exe' } | Sort-Object FullName)
          if ($files.Count -eq 0) { throw 'No Windows installers were produced.' }
          $lines = $files | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLowerInvariant()
            $relative = [IO.Path]::GetRelativePath($bundleRoot, $_.FullName).Replace('\', '/')
            "$hash  $relative"
          }
          $checksum = 'src-tauri/target/release/SHA256SUMS-windows.txt'
          $lines | Set-Content -Encoding ascii $checksum
          gh release upload "v$version" $checksum --clobber

  publish-release:
    name: Publish draft release
    needs: publish
    permissions:
      contents: write
    environment: production-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Generate and upload release assets manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          rm -rf release-assets
          mkdir -p release-assets
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir release-assets --clobber
          RELEASE_VERSION="$version" RELEASE_TAG="$tag" node .github/scripts/verify-release-assets.mjs release-assets
          rm -f release-assets/release-assets-manifest.json
          RELEASE_VERSION="$version" RELEASE_TAG="$tag" RELEASE_DIR="$PWD/release-assets" RELEASE_REPOSITORY="$GITHUB_REPOSITORY" node --input-type=module <<'EOF'
          import { createHash } from "node:crypto";
          import { readFile, readdir, stat, writeFile } from "node:fs/promises";
          import { join } from "node:path";

          const directory = process.env.RELEASE_DIR;
          const names = await readdir(directory);
          const assets = [];
          for (const name of names) {
            const path = join(directory, name);
            const metadata = await stat(path);
            if (!metadata.isFile()) continue;
            const bytes = await readFile(path);
            const sha256 = createHash("sha256").update(bytes).digest("hex");
            const lower = name.toLowerCase();
            const platform = /windows|win|msi|nsis|setup\.exe/.test(lower)
              ? "windows"
              : /linux|appimage|\.deb$|\.rpm$|\.tar\.gz$/.test(lower)
                ? "linux"
                : "metadata";
            const kind = lower.endsWith(".sig")
              ? "signature"
              : lower === "latest.json"
                ? "updater-manifest"
                : lower.startsWith("sha256sums-")
                  ? "checksum"
                  : /\.nsis\.zip$|\.msi\.zip$|\.tar\.gz$/.test(lower)
                    ? "updater-bundle"
                    : "installer";
            assets.push({
              name,
              kind,
              platform,
              bytes: metadata.size,
              sha256,
              downloadUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.RELEASE_REPOSITORY}/releases/download/${process.env.RELEASE_TAG}/${encodeURIComponent(name)}`,
            });
          }
          assets.sort((left, right) => left.name.localeCompare(right.name));
          const manifest = {
            schemaVersion: 1,
            version: process.env.RELEASE_VERSION,
            tag: process.env.RELEASE_TAG,
            repository: process.env.RELEASE_REPOSITORY,
            generatedAt: new Date().toISOString(),
            assets,
          };
          await writeFile("release-assets-manifest.json", `${JSON.stringify(manifest, null, 2)}\n`);
          EOF
          gh release upload "$tag" release-assets-manifest.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish release after all platform uploads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release edit "v${version}" --repo "$GITHUB_REPOSITORY" --draft=false
