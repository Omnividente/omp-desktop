name: Build and Publish Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Quality gate for release SHA
    uses: ./.github/workflows/pr.yml

  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require tagged commit on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit reachable from main." >&2
            exit 1
          fi

      - name: Require matching semantic versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from "node:fs/promises";
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/;
          const tag = process.env.RELEASE_TAG ?? "";
          const version = tag.startsWith("v") ? tag.slice(1) : "";
          const packageManifest = JSON.parse(await readFile("package.json", "utf8"));
          const tauriConfig = JSON.parse(await readFile("src-tauri/tauri.conf.json", "utf8"));
          const cargoManifest = await readFile("src-tauri/Cargo.toml", "utf8");
          const cargoVersion = cargoManifest.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          if (!semver.test(version)) throw new Error(`Release tag ${tag} is not semantic.`);
          if (packageManifest.version !== version || tauriConfig.version !== version || cargoVersion !== version) {
            throw new Error(`Tag ${tag} must match package.json, tauri.conf.json, and Cargo.toml.`);
          }
          EOF

      - name: Require versioned release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: test -s ".github/release-notes/${RELEASE_TAG}.md"

  prepare-release:
    name: Prepare unique draft release
    needs:
      - quality-gate
      - validate-tag
    permissions:
      contents: write
    environment: production-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Check out release SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Create or reuse exactly one draft
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          release_notes=".github/release-notes/${RELEASE_TAG}.md"
          release_body=$(cat "$release_notes")
          release_pages="$RUNNER_TEMP/release-pages.json"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --paginate --slurp > "$release_pages"
          release_id=$(ALLOW_MISSING_RELEASE=true \
            RELEASE_LIST="$release_pages" \
            RELEASE_TAG="$RELEASE_TAG" \
            node .github/scripts/verify-release-assets.mjs --select-draft)

          if [[ "$release_id" == "none" ]]; then
            prerelease=false
            if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=true; fi
            created_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              --raw-field tag_name="$RELEASE_TAG" \
              --raw-field target_commitish="$RELEASE_SHA" \
              --raw-field name="OMP Desktop $RELEASE_TAG" \
              --raw-field body="$release_body" \
              --field draft=true \
              --field prerelease="$prerelease" \
              --jq .id)
            release_id=$(EXPECTED_RELEASE_ID="$created_id" \
              RELEASE_TAG="$RELEASE_TAG" \
              node .github/scripts/verify-release-assets.mjs --wait-for-draft)
            if [[ "$release_id" != "$created_id" ]]; then
              echo "Created release $created_id but resolved $release_id for $RELEASE_TAG." >&2
              exit 1
            fi
          else
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              --raw-field body="$release_body" >/dev/null
          fi

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  publish:
    name: Build and upload (${{ matrix.platform }})
    needs:
      - quality-gate
      - validate-tag
      - prepare-release
    permissions:
      contents: write
    environment: production-release
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-22.04
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            file

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify production updater signing secret
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.PRODUCTION_TAURI_SIGNING_PRIVATE_KEY }}
        run: node -e "if (!process.env.TAURI_SIGNING_PRIVATE_KEY?.trim()) throw new Error('PRODUCTION_TAURI_SIGNING_PRIVATE_KEY is required in the production-release environment');"

      - name: Require the prepared draft release
        env:
          EXPECTED_RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          release_pages="$RUNNER_TEMP/release-pages.json"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --paginate --slurp > "$release_pages"
          release_id=$(RELEASE_LIST="$release_pages" \
            RELEASE_TAG="$RELEASE_TAG" \
            node .github/scripts/verify-release-assets.mjs --select-draft)
          if [[ "$release_id" != "$EXPECTED_RELEASE_ID" ]]; then
            echo "Expected release $EXPECTED_RELEASE_ID but resolved $release_id." >&2
            exit 1
          fi

      - name: Load versioned release notes
        id: release-notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          {
            echo "body<<OMP_RELEASE_NOTES"
            cat ".github/release-notes/${RELEASE_TAG}.md"
            echo "OMP_RELEASE_NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: Build, sign, and upload Tauri artifacts
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.PRODUCTION_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.PRODUCTION_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: v__VERSION__
          releaseName: OMP Desktop v__VERSION__
          releaseBody: ${{ steps.release-notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: true

  publish-release:
    name: Publish draft release
    needs:
      - prepare-release
      - publish
    permissions:
      contents: write
    environment: production-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify release assets and upload manifest
        env:
          EXPECTED_RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="$RELEASE_TAG"
          if [[ "v${version}" != "$tag" ]]; then
            echo "Release tag $tag does not match package version $version." >&2
            exit 1
          fi

          release_pages="$RUNNER_TEMP/release-pages.json"
          metadata="$RUNNER_TEMP/release-metadata.json"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --paginate --slurp > "$release_pages"
          release_id=$(RELEASE_LIST="$release_pages" \
            RELEASE_TAG="$tag" \
            node .github/scripts/verify-release-assets.mjs --select-draft)
          if [[ "$release_id" != "$EXPECTED_RELEASE_ID" ]]; then
            echo "Expected release $EXPECTED_RELEASE_ID but resolved $release_id." >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$metadata"
          RELEASE_METADATA="$metadata" \
            node .github/scripts/verify-release-assets.mjs --require-draft

          rm -rf release-assets
          mkdir -p release-assets
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir release-assets --clobber
          rm -f release-assets/release-assets-manifest.json
          node .github/scripts/verify-release-assets.mjs --write-checksums release-assets
          cp release-assets/SHA256SUMS-linux.txt "$RUNNER_TEMP/generated-SHA256SUMS-linux.txt"
          cp release-assets/SHA256SUMS-windows.txt "$RUNNER_TEMP/generated-SHA256SUMS-windows.txt"

          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --paginate --slurp > "$release_pages"
          release_id=$(RELEASE_LIST="$release_pages" \
            RELEASE_TAG="$tag" \
            node .github/scripts/verify-release-assets.mjs --select-draft)
          if [[ "$release_id" != "$EXPECTED_RELEASE_ID" ]]; then
            echo "Expected release $EXPECTED_RELEASE_ID but resolved $release_id." >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$metadata"
          RELEASE_METADATA="$metadata" \
            node .github/scripts/verify-release-assets.mjs --require-draft
          gh release upload "$tag" \
            release-assets/SHA256SUMS-linux.txt \
            release-assets/SHA256SUMS-windows.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          rm -f release-assets/SHA256SUMS-linux.txt release-assets/SHA256SUMS-windows.txt
          gh release download "$tag" \
            --pattern "SHA256SUMS-*.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --clobber
          cmp --silent \
            "$RUNNER_TEMP/generated-SHA256SUMS-linux.txt" \
            release-assets/SHA256SUMS-linux.txt || {
              echo "Uploaded Linux checksum bytes differ from the generated file." >&2
              exit 1
            }
          cmp --silent \
            "$RUNNER_TEMP/generated-SHA256SUMS-windows.txt" \
            release-assets/SHA256SUMS-windows.txt || {
              echo "Uploaded Windows checksum bytes differ from the generated file." >&2
              exit 1
            }

          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$metadata"
          RELEASE_VERSION="$version" RELEASE_TAG="$tag" RELEASE_REPOSITORY="$GITHUB_REPOSITORY" RELEASE_METADATA="$metadata" node .github/scripts/verify-release-assets.mjs release-assets
          RELEASE_VERSION="$version" RELEASE_TAG="$tag" RELEASE_DIR="$PWD/release-assets" RELEASE_REPOSITORY="$GITHUB_REPOSITORY" node --input-type=module <<'EOF'
          import { createHash } from "node:crypto";
          import { createReadStream } from "node:fs";
          import { readdir, stat, writeFile } from "node:fs/promises";
          import { join } from "node:path";
          import { classifyReleaseAsset } from "./.github/scripts/verify-release-assets.mjs";

          async function hashFile(path) {
            const hash = createHash("sha256");
            for await (const chunk of createReadStream(path)) hash.update(chunk);
            return hash.digest("hex");
          }
          const directory = process.env.RELEASE_DIR;
          const names = await readdir(directory);
          const assets = [];
          for (const name of names) {
            const path = join(directory, name);
            const metadata = await stat(path);
            if (!metadata.isFile()) continue;
            const sha256 = await hashFile(path);
            const { kind, platform } = classifyReleaseAsset(name);
            assets.push({
              name,
              kind,
              platform,
              bytes: metadata.size,
              sha256,
              downloadUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.RELEASE_REPOSITORY}/releases/download/${process.env.RELEASE_TAG}/${encodeURIComponent(name)}`,
            });
          }
          assets.sort((left, right) => left.name.localeCompare(right.name));
          const manifest = {
            schemaVersion: 1,
            version: process.env.RELEASE_VERSION,
            tag: process.env.RELEASE_TAG,
            repository: process.env.RELEASE_REPOSITORY,
            generatedAt: new Date().toISOString(),
            assets,
          };
          await writeFile("release-assets-manifest.json", `${JSON.stringify(manifest, null, 2)}\n`);
          EOF
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$metadata"
          RELEASE_METADATA="$metadata" \
            node .github/scripts/verify-release-assets.mjs --require-draft
          gh release upload "$tag" release-assets-manifest.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish release after all platform uploads
        env:
          EXPECTED_RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [[ "v${version}" != "$RELEASE_TAG" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $version." >&2
            exit 1
          fi

          release_pages="$RUNNER_TEMP/release-pages.json"
          metadata="$RUNNER_TEMP/release-metadata.json"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --paginate --slurp > "$release_pages"
          release_id=$(RELEASE_LIST="$release_pages" \
            RELEASE_TAG="$RELEASE_TAG" \
            node .github/scripts/verify-release-assets.mjs --select-draft)
          if [[ "$release_id" != "$EXPECTED_RELEASE_ID" ]]; then
            echo "Expected release $EXPECTED_RELEASE_ID but resolved $release_id." >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$metadata"
          RELEASE_METADATA="$metadata" \
            node .github/scripts/verify-release-assets.mjs --require-draft

          remote_refs=$(git ls-remote --exit-code origin \
            "refs/tags/${RELEASE_TAG}" \
            "refs/tags/${RELEASE_TAG}^{}")
          direct_sha=""
          peeled_sha=""
          while read -r sha ref; do
            case "$ref" in
              "refs/tags/${RELEASE_TAG}") direct_sha="$sha" ;;
              "refs/tags/${RELEASE_TAG}^{}") peeled_sha="$sha" ;;
            esac
          done <<< "$remote_refs"
          remote_sha="${peeled_sha:-$direct_sha}"
          if [[ "$remote_sha" != "$RELEASE_SHA" ]]; then
            echo "Release tag $RELEASE_TAG moved from $RELEASE_SHA to ${remote_sha:-missing}." >&2
            exit 1
          fi

          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            --field draft=false \
            --silent
