name: Build Release Artifacts

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require a matching semantic version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from "node:fs/promises";

          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/;
          const tag = process.env.RELEASE_TAG ?? "";
          const version = tag.startsWith("v") ? tag.slice(1) : "";
          const packageManifest = JSON.parse(await readFile("package.json", "utf8"));
          const tauriConfig = JSON.parse(await readFile("src-tauri/tauri.conf.json", "utf8"));
          const cargoManifest = await readFile("src-tauri/Cargo.toml", "utf8");
          const cargoVersion = cargoManifest.match(/^version\s*=\s*"([^"]+)"/m)?.[1];

          if (!semver.test(version)) {
            throw new Error(`Release tag ${tag} is not a valid v-prefixed semantic version.`);
          }
          if (
            packageManifest.version !== version ||
            tauriConfig.version !== version ||
            cargoVersion !== version
          ) {
            throw new Error(
              `Tag ${tag} must match package.json, src-tauri/tauri.conf.json, and src-tauri/Cargo.toml.`,
            );
          }
          EOF

  build:
    name: Bundle (${{ matrix.os }})
    needs: validate-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            file

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri bundles
        run: npm run tauri build

      - name: Create Linux checksums
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          cd src-tauri/target/release/bundle
          find . -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > ../SHA256SUMS-linux.txt
          test -s ../SHA256SUMS-linux.txt

      - name: Create Windows checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundleRoot = Join-Path $PWD "src-tauri/target/release/bundle"
          $files = @(
            Get-ChildItem -Path $bundleRoot -Recurse -File |
              Where-Object { $_.Extension -in ".msi", ".exe" } |
              Sort-Object FullName
          )
          if ($files.Count -eq 0) {
            throw "No Windows installers were produced."
          }
          $lines = $files | ForEach-Object {
            $relativePath = [IO.Path]::GetRelativePath($bundleRoot, $_.FullName).Replace("\", "/")
            $hash = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLowerInvariant()
            "$hash  $relativePath"
          }
          $lines | Set-Content -Encoding ascii -Path "src-tauri/target/release/SHA256SUMS-windows.txt"

      - name: Upload Linux installers and checksums
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: omp-desktop-linux-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/SHA256SUMS-linux.txt

      - name: Upload Windows installers and checksums
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: omp-desktop-windows-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/SHA256SUMS-windows.txt
