name: Build Signed Updater E2E Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: updater-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.version }} (${{ matrix.os }})
    environment: updater-e2e
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 0.1.12-rc.1
          - 0.1.12-rc.2
        os:
          - ubuntu-22.04
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            file

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify isolated updater E2E public key
        env:
          UPDATER_E2E_PUBLIC_KEY: ${{ vars.UPDATER_E2E_PUBLIC_KEY }}
        run: >-
          node -e "const fs = require('node:fs'); const e2e = process.env.UPDATER_E2E_PUBLIC_KEY?.trim(); if (!e2e) throw new Error('UPDATER_E2E_PUBLIC_KEY is required in the updater-e2e environment'); const config = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')); const production = config?.plugins?.updater?.pubkey?.trim(); if (!production) throw new Error('Production updater public key is missing in src-tauri/tauri.conf.json'); if (e2e === production) throw new Error('UPDATER_E2E_PUBLIC_KEY must differ from the production updater public key in src-tauri/tauri.conf.json');"

      - name: Verify updater E2E signing secret
        env:
          UPDATER_E2E_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATER_E2E_SIGNING_PRIVATE_KEY }}
        run: >-
          node -e "if (!process.env.UPDATER_E2E_SIGNING_PRIVATE_KEY?.trim()) throw new Error('UPDATER_E2E_SIGNING_PRIVATE_KEY is required in the updater-e2e environment');"

      - name: Create updater E2E overlays
        env:
          E2E_VERSION: ${{ matrix.version }}
          UPDATER_E2E_PUBLIC_KEY: ${{ vars.UPDATER_E2E_PUBLIC_KEY }}
        run: >-
          node -e "const fs = require('node:fs'); fs.writeFileSync('.tmp-tauri-updater-e2e-version.json', JSON.stringify({ version: process.env.E2E_VERSION })); fs.writeFileSync('.tmp-tauri-updater-e2e-trust.json', JSON.stringify({ plugins: { updater: { pubkey: process.env.UPDATER_E2E_PUBLIC_KEY } } }));"

      - name: Build signed Linux AppImage
        if: runner.os == 'Linux'
        env:
          CI: "false"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATER_E2E_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATER_E2E_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          npx tauri build
          --bundles appimage
          --features updater-e2e
          --config src-tauri/tauri.updater-e2e.conf.json
          --config .tmp-tauri-updater-e2e-version.json
          --config .tmp-tauri-updater-e2e-trust.json

      - name: Build signed Windows NSIS installer
        if: runner.os == 'Windows'
        env:
          CI: "false"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATER_E2E_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATER_E2E_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          npx tauri build
          --bundles nsis
          --features updater-e2e
          --config src-tauri/tauri.updater-e2e.conf.json
          --config .tmp-tauri-updater-e2e-version.json
          --config .tmp-tauri-updater-e2e-trust.json

      - name: Upload Linux updater artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: updater-e2e-${{ matrix.version }}-linux-x86_64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error
          retention-days: 3

      - name: Upload Windows updater artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: updater-e2e-${{ matrix.version }}-windows-x86_64
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          retention-days: 3
