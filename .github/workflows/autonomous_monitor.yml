name: Autonomous Monitor

# Read-only health report for the parallel loop. Changes nothing.
#
# It reports the lifecycle of the queue, not just how many runs happened, so a
# loop that keeps starting work without finishing any is visible immediately.
#
# It also reports whether the workflows that must exist on the integration
# branch itself are still identical to the default branch. It only reports:
# a monitor that repaired them would be a monitor that can rewrite workflows.

on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  monitor:
    name: Report loop health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INTEGRATION_BRANCH: autonomous/lab
      DEFAULT_BRANCH: main
      GH_TOKEN: ${{ github.token }}
      LOOP_ENABLED: ${{ vars.JULES_LOOP_ENABLED }}
    steps:
      - name: Check out the control plane from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          path: control

      - name: Check out the integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: autonomous/lab
          fetch-depth: 0
          path: lab

      - name: Validate control plane
        run: |
          set -euo pipefail
          python3 control/scripts/autonomous/verify_policy.py --config control/autonomous-project.json --integration-branch "${INTEGRATION_BRANCH}"
          python3 control/scripts/autonomous/state_store.py --action load --repo lab --manifest queue.json --revision-file queue-revision.json --seed lab/agent_tasks.json
          python3 control/scripts/autonomous/validate_tasks.py queue.json

      - name: Report drift in the loop entry points on the integration branch
        id: drift
        env:
          ENTRY_WORKFLOWS: ".github/workflows/autonomous_evidence_gate.yml .github/workflows/autonomous_next_task.yml .github/workflows/autonomous_control_ci.yml"
        run: |
          set -euo pipefail
          # GitHub resolves a pull_request workflow from the ref of the event, so
          # these files have to be on the integration branch or pull requests
          # into it silently run without an evidence gate.
          drift=0
          {
            echo "### Loop entry points on ${INTEGRATION_BRANCH}"
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
          for path in ${ENTRY_WORKFLOWS}; do
            if [ ! -f "lab/${path}" ]; then
              echo "- \`${path}\`: **missing on the branch**, so pull requests into it never run it" >> "${GITHUB_STEP_SUMMARY}"
              drift=$((drift + 1))
            elif cmp -s "control/${path}" "lab/${path}"; then
              echo "- \`${path}\`: identical to ${DEFAULT_BRANCH}" >> "${GITHUB_STEP_SUMMARY}"
            else
              echo "- \`${path}\`: **differs from ${DEFAULT_BRANCH}**" >> "${GITHUB_STEP_SUMMARY}"
              drift=$((drift + 1))
            fi
          done
          echo "drift=${drift}" >> "${GITHUB_OUTPUT}"
          if [ "${drift}" != "0" ]; then
            {
              echo ""
              echo "Run **Autonomous Sync Main** to validate and synchronize the accepted control plane. Human proposals do not block synchronization. This monitor never writes workflow files itself."
              echo ""
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "::warning::${drift} loop entry point(s) on ${INTEGRATION_BRANCH} are missing or out of date, so its pull requests may run without an evidence gate."
          fi

      - name: Report observed readiness and attention
        env:
          ENTRY_DRIFT: ${{ steps.drift.outputs.drift }}
        run: |
          set -euo pipefail
          git -C lab fetch --no-tags origin "${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          python3 control/scripts/autonomous/health_snapshot.py --manifest queue.json --config control/autonomous-project.json
          # A green job is not proof of publication; inspect its retained outcome.
          sync_id=$(jq -r '[.[] | select(.head_branch == "main" and .status == "completed")] | max_by(.id) | .id // empty' sync-runs.json)
          sync_args=()
          if [ -n "${sync_id}" ]; then
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${sync_id}/artifacts" > sync-artifacts.json
            artifact=$(jq -r '[.artifacts[] | select(.expired == false and (.name | startswith("autonomous-sync-result-")))] | max_by(.id) | .name // empty' sync-artifacts.json)
            if [ -n "${artifact}" ]; then
              gh run download "${sync_id}" --repo "${GITHUB_REPOSITORY}" --name "${artifact}" --dir sync-outcome
            else
              mkdir -p sync-outcome
              jq -n --arg main "$(git -C lab rev-parse refs/remotes/origin/main)" '{main_sha:$main,status:"unknown",reason:"sync_outcome_missing"}' > sync-outcome/sync-result.json
            fi
            sync_args=(--sync-result sync-outcome/sync-result.json)
          fi
          enabled=false
          if [ "${LOOP_ENABLED}" = "true" ]; then enabled=true; fi
          # Read-only: neither the planner's prospective task nor lifecycle
          # reconciliation is written back to the integration queue.
          status=0
          python3 control/scripts/autonomous/loop_health.py --manifest queue.json --state-revision queue-revision.json "${sync_args[@]}" --config control/autonomous-project.json --repo lab --runs next-runs.json --sync-runs sync-runs.json --wakeup-runs wakeup-runs.json --pull-requests pull-requests.json --enabled "${enabled}" > health.json || status=$?
          {
            echo '### Autonomous loop health'
            echo ''
            echo "- Loop entry points out of date: ${ENTRY_DRIFT:-unknown}"
            echo '- Releases: disabled by policy, human-gated'
            echo ''
            echo '### Scheduler, independent of proposal attention'
            jq -r '(.scheduler // {}) | "- Last useful tick: \(.last_tick_at // "unknown")\n- Last worker poll: \(.last_poll_at // "unknown")\n- Next deadline: \(.due_at // "none")\n- Overdue seconds: \(.overdue_seconds // 0)\n- Scheduler state: \(.state // "unknown")\n- Waiting owner: \(.wakeup_run.id // "none")"' health.json
            echo ''
            echo 'Observed controller decision (no action taken):'
            echo '```json'
            cat health.json
            echo '```'
            echo ''
            echo 'report_invalid: inspect the stored diagnostics and reharvest the same completed session with retry_report; do not launch another AI attempt.'
            echo 'sync_failed: inspect the failed candidate checks, repair the cause and explicitly run Autonomous Sync Main. Automatic retries of that main revision are paused.'
            echo 'next_task_stalled / scheduler_overdue: useful work missed its deadline; green skipped runs do not reset progress. Inspect the timer owner and confirmed handoff.'
            echo 'worker_awaiting_feedback / worker_awaiting_approval / worker_paused: act only in the linked existing Jules session; observation runs never answer or create a replacement. Scheduled polls use 30-minute cadence.'
          } >> "${GITHUB_STEP_SUMMARY}"
          health=$(jq -r '.health' health.json)
          attention=$(jq '.attention // [] | length' health.json)
          if [ "${status}" != 0 ] || [ "${health}" = stalled ] || [ "${health}" = attention ] || [ "${attention}" -gt 0 ]; then
            echo '::error::Autonomous loop needs attention; see observed timestamps and reason codes in the job summary.'
            exit 1
          fi

      - name: Retain machine-readable health
        if: ${{ always() && hashFiles('health.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autonomous-health
          path: health.json
          retention-days: 14
