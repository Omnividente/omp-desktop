name: Autonomous Evidence Gate

# Proves - rather than trusts - that an autonomous bugfix is backed by a test
# that fails without it.
#
# The worker prompt asks for a failing-first regression test, but an
# instruction is not a guarantee, and the ordinary Quality Gate only shows that
# the suite is green *after* the change. This job reverts the changed product
# sources to the base revision, runs the new tests (they must fail), restores
# the fix and runs them again (they must pass).
#
# A change that cannot be proven this way is not silently blocked: automerge
# routes it to manual review, so a human decides.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - autonomous/lab

permissions:
  contents: read

concurrency:
  group: autonomous-evidence-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence:
    name: Autonomous Evidence Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the control plane from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          path: control

      - name: Check out the pull request revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: pr

      - name: Collect the files changed by this revision
        working-directory: pr
        run: |
          set -euo pipefail
          merge_base=$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")
          echo "MERGE_BASE=${merge_base}" >> "${GITHUB_ENV}"
          echo "Comparing ${merge_base} (base) with ${HEAD_SHA} (head)"
          git diff --name-only "${merge_base}" "${HEAD_SHA}" > "${GITHUB_WORKSPACE}/changed-files.txt"
          cat "${GITHUB_WORKSPACE}/changed-files.txt"

      - name: Plan the proof
        id: plan
        run: python3 control/scripts/autonomous/evidence_plan.py --config control/autonomous-project.json --changed-files changed-files.txt --github-output "${GITHUB_OUTPUT}"

      - name: Nothing to prove
        if: ${{ steps.plan.outputs.mode == 'no_source_change' }}
        run: |
          echo "No product source changed in this pull request, so there is no regression claim to prove."
          echo "### Autonomous Evidence Gate: nothing to prove" >> "${GITHUB_STEP_SUMMARY}"

      - name: Refuse a change that cannot be proven
        if: ${{ steps.plan.outputs.mode != 'no_source_change' && steps.plan.outputs.proof_supported != 'true' }}
        run: |
          set -uo pipefail
          python3 control/scripts/autonomous/evidence_plan.py --config control/autonomous-project.json --changed-files changed-files.txt > plan.txt 2>&1
          cat plan.txt
          {
            echo "### Autonomous Evidence Gate: manual acceptance required"
            echo ""
            echo "Reviewed revision: ${HEAD_SHA}"
            echo ""
            echo '```'
            cat plan.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::error::This pull request changes product source without a reproducible proof that the defect existed first. A human has to accept it."
          exit 1

      - name: Set up Node
        if: ${{ steps.plan.outputs.mode == 'proof_required_ts' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pr/package-lock.json

      - name: Install dependencies
        if: ${{ steps.plan.outputs.mode == 'proof_required_ts' }}
        working-directory: pr
        run: npm ci

      - name: Prove the test fails without the fix and passes with it
        if: ${{ steps.plan.outputs.mode == 'proof_required_ts' }}
        working-directory: pr
        env:
          TS_TEST_FILES: ${{ steps.plan.outputs.ts_test_files }}
          SOURCE_FILES: ${{ steps.plan.outputs.source_files }}
        run: |
          set -uo pipefail
          echo "Tests under proof: ${TS_TEST_FILES}"
          echo "Sources to revert: ${SOURCE_FILES}"

          for file in ${SOURCE_FILES}; do
            if git cat-file -e "${MERGE_BASE}:${file}" 2> /dev/null; then
              git checkout "${MERGE_BASE}" -- "${file}" || exit 1
              echo "restored the base revision of ${file}"
            else
              rm -f "${file}"
              echo "removed ${file} (absent at the base revision)"
            fi
          done

          echo "::group::Run without the fix (must fail)"
          npx vitest run ${TS_TEST_FILES} > ../before.log 2>&1
          before=$?
          tail -n 60 ../before.log
          echo "::endgroup::"

          git checkout "${HEAD_SHA}" -- . || exit 1

          echo "::group::Run with the fix (must pass)"
          npx vitest run ${TS_TEST_FILES} > ../after.log 2>&1
          after=$?
          tail -n 60 ../after.log
          echo "::endgroup::"

          {
            echo "### Autonomous Evidence Gate"
            echo ""
            echo "- Base revision: ${MERGE_BASE}"
            echo "- Head revision: ${HEAD_SHA}"
            echo "- Tests: ${TS_TEST_FILES}"
            echo "- Without the fix: exit ${before} (must be non-zero)"
            echo "- With the fix: exit ${after} (must be zero)"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${before}" = "0" ]; then
            echo "::error::The test passes against the base revision, so it does not prove that anything was broken. Write a test that fails without the fix."
            exit 1
          fi
          if [ "${after}" != "0" ]; then
            echo "::error::The test does not pass with the fix applied (exit ${after})."
            exit 1
          fi
          echo "Proof complete: the test fails at ${MERGE_BASE} and passes at ${HEAD_SHA}."
