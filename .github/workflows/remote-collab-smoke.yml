name: Remote Collab runtime smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - tools/remote-collab-spike/**
      - .github/workflows/remote-collab-smoke.yml

permissions:
  contents: read

concurrency:
  group: remote-collab-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  runtime:
    name: OMP 18.18.1 isolated compatibility
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install isolated test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          python -m pip install --disable-pip-version-check websockets==16.0 cryptography==50.0.0

      - name: Download pinned official OMP asset
        run: |
          curl --fail --location --retry 3 --max-time 180 \
            https://github.com/can1357/oh-my-pi/releases/download/v18.18.1/omp-linux-x64 \
            --output "$RUNNER_TEMP/omp-18.18.1-linux-x64"
          chmod 700 "$RUNNER_TEMP/omp-18.18.1-linux-x64"

      - name: Check real runtime with a synthetic session and loopback relay
        run: |
          python tools/remote-collab-spike/runtime-smoke.py \
            --omp "$RUNNER_TEMP/omp-18.18.1-linux-x64" \
            --expected-sha256 2a75e16550676783b3bc8be0e06513478dd5881efc647954642ab30db8f9be06
