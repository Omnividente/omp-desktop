name: Autonomous Observe Planned Dispatch

# Observe an already acknowledged partial closure. No CAS, retry or handoff.
on:
  workflow_dispatch:
    inputs:
      expected_state_sha:
        description: Original native state SHA named by the acknowledged partial closure
        type: string
        required: true
      decision_id:
        description: Original NEXT with an acknowledged partial checkpoint completion
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
        'autonomous-lab-queue' || format('autonomous-planned-observation-ignored-{0}', github.run_id) }}
  queue: max
  cancel-in-progress: false

jobs:
  observe:
    name: Observe planned identity from an existing partial closure
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.PAT || secrets.GH_TOKEN }}
      EXPECTED_STATE_SHA: ${{ inputs.expected_state_sha }}
      DECISION_ID: ${{ inputs.decision_id }}
    steps:
      - name: Check out the pinned event-main observer without historical blobs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          filter: blob:none
          fetch-depth: 0
          path: control
          persist-credentials: false

      - name: Load authoritative state without writing a queue revision
        shell: bash
        run: |
          set -euo pipefail
          python3 control/scripts/autonomous/state_store.py --action load \
            --repo control --manifest queue.json --revision-file queue-revision.json

      - name: Observe the acknowledged planned identity with GET only
        shell: bash
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          JULES_API_KEY_BACKUP: ${{ secrets.JULES_API_KEY_BACKUP }}
        run: |
          set -euo pipefail
          python3 control/scripts/autonomous/planned_dispatch_observation.py \
            --manifest queue.json --revision-file queue-revision.json \
            --expected-state-sha "${EXPECTED_STATE_SHA}" --decision-id "${DECISION_ID}" \
            --repository "${GITHUB_REPOSITORY}" --out planned-dispatch-observation.json

      - name: Retain only the independent read-only observation
        if: ${{ always() && hashFiles('planned-dispatch-observation.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: planned-dispatch-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: planned-dispatch-observation.json
          retention-days: 30
          if-no-files-found: error
