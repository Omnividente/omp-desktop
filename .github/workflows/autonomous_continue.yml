name: Autonomous Continue
run-name: >-
  ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_run' &&
      (github.event.workflow_run.head_branch == 'main' ||
       github.event.workflow_run.name == 'Autonomous Proposal Review') &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      format('Continue trusted callback {0}', github.run_id) ||
      (inputs.continuation_key != '' && format('Continue {0}', inputs.continuation_key) || 'Autonomous Continue') }}

# The explicit dispatch relay owns cadence; schedule and completion events recover
# a lost owner. Waiting never holds the queue writer lock.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      continuation_key:
        description: Correlation key for an automatic handoff
        type: string
        default: ""
      control_sha:
        description: Frozen trusted controller revision for an internal dispatch
        type: string
        default: ""
  workflow_run:
    workflows:
      - Autonomous Next Task
      - Autonomous Sync Main
      - Autonomous Loop Switch
      - Autonomous Proposal Review
      - Autonomous Replenish
    types: [completed]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: read

# Only keyed dispatches occupy the obligatory chain's one running/one pending
# slot. Coalescible ingress signals cannot replace its pending successor.
# Duplicate keyed deliveries still compete for the journal's one-use claim;
# concurrency does not grant admission. Isolate untrusted callbacks before queueing.
concurrency:
  group: >-
    ${{ github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'schedule' ||
         github.event_name == 'workflow_dispatch' ||
         (github.event_name == 'workflow_run' &&
          (github.event.workflow_run.head_branch == 'main' ||
           github.event.workflow_run.name == 'Autonomous Proposal Review') &&
          github.event.workflow_run.head_repository.full_name == github.repository)) &&
        (github.event_name == 'workflow_dispatch' && inputs.continuation_key != '' &&
         'autonomous-lab-wakeup-chain' || 'autonomous-lab-wakeup-ingress') ||
        format('autonomous-lab-ignored-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  continue:
    name: Wake the ready controller
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'schedule' ||
           github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'workflow_run' &&
            (github.event.workflow_run.head_branch == 'main' ||
             github.event.workflow_run.name == 'Autonomous Proposal Review') &&
            github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.PAT || secrets.GH_TOKEN }}
      CONTROL_SHA: ${{ github.sha }}
      CONTINUATION_KEY: ${{ inputs.continuation_key }}
    steps:
      - name: Check out the trusted control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: control
          persist-credentials: false

      - name: Authenticate the frozen receiver controller
        id: control_pin
        run: >-
          python3 control/scripts/autonomous/workflow_admission.py
          --repo control --config control/autonomous-project.json
          --workflow autonomous_continue.yml

      - name: Check out the authenticated receiver revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.control_pin.outputs.control_sha }}
          path: control
          persist-credentials: false

      - name: Check out the integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: autonomous/lab
          fetch-depth: 0
          path: lab
          persist-credentials: false

      - name: Wait for the next deadline and confirm the successor
        run: >-
          python3 control/scripts/autonomous/continue_loop.py
          --repo lab --config control/autonomous-project.json
          --out continuation-result.json

      - name: Retain continuation decision and handoff proof
        if: ${{ always() && hashFiles('continuation-result.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: continuation-${{ github.run_id }}-${{ github.run_attempt }}
          path: continuation-result.json
          retention-days: 14
          if-no-files-found: error
