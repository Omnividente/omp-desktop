name: Autonomous Continue
run-name: >-
  ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_run' &&
      (github.event.workflow_run.head_branch == 'main' ||
       github.event.workflow_run.name == 'Autonomous Proposal Review') &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      format('Continue trusted callback {0}', github.run_id) ||
      (inputs.continuation_key != '' && format('Continue {0}', inputs.continuation_key) || 'Autonomous Continue') }}

# The explicit dispatch relay owns cadence; schedule and completion events recover
# a lost owner. Waiting never holds the queue writer lock.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      continuation_key:
        description: Correlation key for an automatic handoff
        type: string
        default: ""
  workflow_run:
    workflows:
      - Autonomous Next Task
      - Autonomous Sync Main
      - Autonomous Loop Switch
      - Autonomous Proposal Review
      - Autonomous Replenish
    types: [completed]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: read

# Coalesce duplicate signals: one running timer and at most one pending wakeup.
# Apply the same trust gate before admission: a skipped feature/fork callback
# must not replace a valid pending successor. Keep workflow-level serialization
# so the Actions run snapshot still identifies the timer owner and pending slot.
concurrency:
  group: >-
    ${{ github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'schedule' ||
         github.event_name == 'workflow_dispatch' ||
         (github.event_name == 'workflow_run' &&
          (github.event.workflow_run.head_branch == 'main' ||
           github.event.workflow_run.name == 'Autonomous Proposal Review') &&
          github.event.workflow_run.head_repository.full_name == github.repository)) &&
        'autonomous-lab-wakeup' || format('autonomous-lab-ignored-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  continue:
    name: Wake the ready controller
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'schedule' ||
           github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'workflow_run' &&
            (github.event.workflow_run.head_branch == 'main' ||
             github.event.workflow_run.name == 'Autonomous Proposal Review') &&
            github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.PAT || secrets.GH_TOKEN }}
    steps:
      - name: Check out the trusted control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          path: control
          persist-credentials: false

      - name: Check out the integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: autonomous/lab
          fetch-depth: 0
          path: lab
          persist-credentials: false

      - name: Wait for the next deadline and confirm the successor
        run: >-
          python3 control/scripts/autonomous/continue_loop.py
          --repo lab --config control/autonomous-project.json
          --out continuation-result.json

      - name: Retain continuation decision and handoff proof
        if: ${{ always() && hashFiles('continuation-result.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: continuation-${{ github.run_id }}-${{ github.run_attempt }}
          path: continuation-result.json
          retention-days: 14
          if-no-files-found: error
