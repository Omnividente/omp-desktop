name: Autonomous Continue

# Explicit workflow_dispatch with GITHUB_TOKEN starts a fresh workflow chain;
# unlike a pure workflow_run chain, it is not cut off after three levels.
on:
  workflow_run:
    workflows:
      - Autonomous Next Task
      - Autonomous Sync Main
      - Autonomous Loop Switch
      - Autonomous Automerge
      - Autonomous Replenish
    types: [completed]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: write

# Wakeups must never hold the queue writer lock while waiting for a worker.
concurrency:
  group: autonomous-lab-wakeup
  queue: max
  cancel-in-progress: false

jobs:
  continue:
    name: Wake the ready controller
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' ||
           (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      # The existing Loop Switch PAT can read the live Actions variable.
      # Dispatch itself uses only the actions:write GITHUB_TOKEN.
      VARIABLE_TOKEN: ${{ secrets.PAT || secrets.GH_TOKEN }}
    steps:
      - name: Check out the trusted control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          path: control

      - name: Check out the integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: autonomous/lab
          fetch-depth: 0
          path: lab

      - name: Decide from live state and dispatch at most one wakeup
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VARIABLE_TOKEN}" ]; then
            echo "::error::The existing Loop Switch PAT (or GH_TOKEN secret) is required to read JULES_LOOP_ENABLED at action time."
            exit 1
          fi
          snapshot() {
            enabled=$(GH_TOKEN="${VARIABLE_TOKEN}" gh variable get JULES_LOOP_ENABLED --repo "${GITHUB_REPOSITORY}")
            if [ "${enabled}" != "true" ]; then enabled=false; fi
            git -C lab fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/autonomous/lab:refs/remotes/origin/autonomous/lab'
            git -C lab checkout --detach refs/remotes/origin/autonomous/lab
            gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/workflows/autonomous_next_task.yml/runs?per_page=100" --jq '.workflow_runs[] | {id,status,conclusion,event,head_branch,head_sha,created_at,run_started_at,updated_at}' | jq -s '.' > next-runs.json
            gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/workflows/autonomous_sync.yml/runs?per_page=100" --jq '.workflow_runs[] | {id,status,conclusion,event,head_branch,head_sha,display_title,created_at,run_started_at,updated_at}' | jq -s '.' > sync-runs.json
            gh api --method GET --paginate "/repos/${GITHUB_REPOSITORY}/pulls" -f base=autonomous/lab -f state=all -f per_page=100 --jq '.[] | {number,state,title,body,merged_at,labels:[.labels[]?.name],draft}' | jq -s '.' > pull-requests.json
            python3 control/scripts/autonomous/loop_health.py --manifest lab/agent_tasks.json --config control/autonomous-project.json --repo lab --runs next-runs.json --sync-runs sync-runs.json --pull-requests pull-requests.json --enabled "${enabled}" > health.json
          }
          snapshot
          delay=$(jq -r '.delay_seconds' health.json)
          if [ "${delay}" -gt 0 ]; then
            # This is a poll of the same bound session, not another AI attempt.
            sleep "$((delay > 90 ? 90 : delay))"
          fi
          # A switch, queue commit or queued run may have arrived during sleep.
          # Even zero-delay wakeups re-read before taking action.
          snapshot
          {
            echo '### Autonomous continuation decision'
            echo '```json'
            cat health.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          action=$(jq -r '.action' health.json)
          if [ "${action}" = "none" ]; then exit 0; fi
          enabled=$(GH_TOKEN="${VARIABLE_TOKEN}" gh variable get JULES_LOOP_ENABLED --repo "${GITHUB_REPOSITORY}")
          if [ "${enabled}" != "true" ]; then
            echo 'Loop disabled before wakeup; no dispatch.' >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          case "${action}" in
            next_task)
              gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/workflows/autonomous_next_task.yml/dispatches" -f ref=main
              ;;
            sync)
              main_sha=$(jq -r '.main_sha' health.json)
              lab_sha=$(jq -r '.lab_sha' health.json)
              gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/workflows/autonomous_sync.yml/dispatches" -f ref=main -f "inputs[main_sha]=${main_sha}" -f "inputs[lab_sha]=${lab_sha}"
              ;;
            *) echo '::error::Unknown health action'; exit 1 ;;
          esac
