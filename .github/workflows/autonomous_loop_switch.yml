name: Autonomous Loop Switch

# Stop new effects first, outside the queue-writer lock. A saved external session
# is quarantined, never forgotten or advertised as cancelled.
on:
  workflow_dispatch:
    inputs:
      loop_enabled:
        description: Enable the research/proposal laboratory
        type: choice
        options: ["true", "false"]
        default: "false"
      prepare_integration_branch:
        description: Create lab only if absent and refresh trusted event entry points
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  stop-dispatch:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop new dispatches before waiting for state ownership
        env:
          GH_TOKEN: ${{ secrets.PAT || secrets.GH_TOKEN }}
        run: gh variable set JULES_LOOP_ENABLED --repo "${GITHUB_REPOSITORY}" --body false

  switch:
    needs: stop-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: autonomous-lab-queue
      queue: max
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.PAT || secrets.GH_TOKEN }}
      LOOP_ENABLED: ${{ inputs.loop_enabled }}
    steps:
      - name: Check out the trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: control
          persist-credentials: false

      - name: Verify manual acceptance and disabled releases
        run: python3 control/scripts/autonomous/verify_policy.py --config control/autonomous-project.json --integration-branch autonomous/lab

      - name: Prepare only a missing integration branch
        if: ${{ inputs.loop_enabled == 'true' && inputs.prepare_integration_branch }}
        run: |
          set -euo pipefail
          refs=$(gh api "/repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/autonomous/lab")
          if ! jq -e 'any(.[]; .ref == "refs/heads/autonomous/lab")' <<< "${refs}" > /dev/null; then
            sha=$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/refs" -f ref=refs/heads/autonomous/lab -f "sha=${sha}"
          fi

      - name: Check out the laboratory without changing its queue
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: autonomous/lab
          fetch-depth: 0
          path: lab
          persist-credentials: false

      - name: Migrate the saved queue once and retain in-flight identities
        run: |
          python3 control/scripts/autonomous/lab_controller.py \
            --repo lab --config control/autonomous-project.json \
            --manifest queue.json --revision-file queue-revision.json \
            --quarantine-all --out switch-result.json

      - name: Refresh trusted event entry points without rewriting product history
        if: ${{ inputs.loop_enabled == 'true' && inputs.prepare_integration_branch }}
        run: |
          set -euo pipefail
          paths=(.github/workflows/autonomous_evidence_gate.yml .github/workflows/autonomous_next_task.yml .github/workflows/autonomous_control_ci.yml)
          for path in "${paths[@]}"; do
            cp "control/${path}" "lab/${path}"
          done
          if ! git -C lab diff --quiet -- "${paths[@]}"; then
            git -C lab config user.name 'github-actions[bot]'
            git -C lab config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C lab add -- "${paths[@]}"
            git -C lab -c commit.gpgsign=false commit -m 'chore(autonomous): refresh trusted event entry points'
            git -C lab -c credential.helper= -c 'credential.https://github.com.helper=!gh auth git-credential' push origin HEAD:refs/heads/autonomous/lab
          fi

      - name: Verify entry points before enabling
        if: ${{ inputs.loop_enabled == 'true' }}
        run: |
          set -euo pipefail
          for path in .github/workflows/autonomous_evidence_gate.yml .github/workflows/autonomous_next_task.yml .github/workflows/autonomous_control_ci.yml; do
            cmp "control/${path}" "lab/${path}"
          done
          gh variable set JULES_LOOP_ENABLED --repo "${GITHUB_REPOSITORY}" --body true

      - name: Explain the switch outcome
        if: always()
        run: |
          {
            echo '### Laboratory switch'
            echo 'Current switch:'
            gh variable get JULES_LOOP_ENABLED --repo "${GITHUB_REPOSITORY}"
            echo ''
            echo 'PR acceptance is always manual. The loop never writes main or releases.'
            echo 'An already-running Jules session is not cancelled. Its identity is retained for reconciliation; disabling never spends another attempt.'
            echo 'The product queue is no longer written. Current state lives in autonomous/state.'
          } >> "${GITHUB_STEP_SUMMARY}"

  handoff:
    needs: switch
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.switch.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ secrets.PAT || secrets.GH_TOKEN }}
    steps:
      - name: Check out the trusted continuation controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: control
          persist-credentials: false
      - name: Start continuation only if the switch is still enabled
        run: >-
          python3 control/scripts/autonomous/continue_loop.py
          --repo control --config control/autonomous-project.json
          --handoff --out continuation-result.json
      - name: Retain observed handoff
        if: ${{ always() && hashFiles('continuation-result.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: switch-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: continuation-result.json
          retention-days: 14
          if-no-files-found: error
