name: Autonomous Loop Switch

# Master on/off switch for the parallel autonomous improvement loop.
# The loop never releases: it only accumulates changes on the integration branch.
#
# Switching on also prepares the integration branch, because a lab branch that
# predates the loop cannot run it. Preparation is additive: a missing branch is
# created from the default branch and a missing task queue is seeded, but work
# already accumulated on the branch is never overwritten.
#
# Switching off releases any task left in flight so the queue cannot deadlock.

on:
  workflow_dispatch:
    inputs:
      loop_enabled:
        description: Enable the autonomous loop
        type: choice
        options:
          - "true"
          - "false"
        default: "true"
      prepare_integration_branch:
        description: Create and seed the integration branch if it is not ready
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: autonomous-loop-switch
  cancel-in-progress: false

jobs:
  switch:
    name: Set the loop state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INTEGRATION_BRANCH: autonomous/lab
      DEFAULT_BRANCH: main
      LOOP_ENABLED: ${{ inputs.loop_enabled }}
      ADMIN_TOKEN: ${{ secrets.PAT || secrets.GH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Set the JULES_LOOP_ENABLED repository variable
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_TOKEN}" ]; then
            echo "::error::Add a repository secret named PAT (or GH_TOKEN) with repo scope so this workflow can manage Actions variables."
            exit 1
          fi
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/variables"
          payload=$(printf '{"name":"JULES_LOOP_ENABLED","value":"%s"}' "${LOOP_ENABLED}")
          code=$(curl -sS -o /tmp/variable.json -w '%{http_code}' -X PATCH -H "Authorization: Bearer ${ADMIN_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${api}/JULES_LOOP_ENABLED" -d "${payload}")
          if [ "${code}" = "404" ]; then
            code=$(curl -sS -o /tmp/variable.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${ADMIN_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${api}" -d "${payload}")
          fi
          echo "HTTP ${code}"
          cat /tmp/variable.json || true
          case "${code}" in
            2*) ;;
            *) exit 1 ;;
          esac

      - name: Prepare the integration branch
        id: prepare
        if: ${{ inputs.prepare_integration_branch }}
        run: |
          set -euo pipefail
          created=false
          seeded=false
          if gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${INTEGRATION_BRANCH}" > /dev/null 2>&1; then
            echo "Integration branch ${INTEGRATION_BRANCH} already exists; leaving its history alone."
          else
            sha=$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${DEFAULT_BRANCH}" --jq '.object.sha')
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/heads/${INTEGRATION_BRANCH}" -f "sha=${sha}"
            created=true
            echo "Created ${INTEGRATION_BRANCH} from ${DEFAULT_BRANCH} at ${sha}."
          fi
          # The loop reads its scripts and policy from the default branch, so the
          # only file the integration branch has to carry is the task queue. An
          # existing queue is never replaced.
          if gh api "/repos/${GITHUB_REPOSITORY}/contents/agent_tasks.json?ref=${INTEGRATION_BRANCH}" > /dev/null 2>&1; then
            echo "Task queue already present on ${INTEGRATION_BRANCH}; keeping the accumulated state."
          else
            content=$(gh api "/repos/${GITHUB_REPOSITORY}/contents/agent_tasks.json?ref=${DEFAULT_BRANCH}" --jq '.content' | tr -d '\n')
            if [ -z "${content}" ]; then
              echo "::error::agent_tasks.json is missing on ${DEFAULT_BRANCH}. Merge the control plane into the default branch first."
              exit 1
            fi
            gh api --method PUT "/repos/${GITHUB_REPOSITORY}/contents/agent_tasks.json" -f "message=chore(autonomous): seed the task queue on the integration branch" -f "content=${content}" -f "branch=${INTEGRATION_BRANCH}" > /dev/null
            seeded=true
            echo "Seeded agent_tasks.json onto ${INTEGRATION_BRANCH} from ${DEFAULT_BRANCH}."
          fi
          echo "created=${created}" >> "${GITHUB_OUTPUT}"
          echo "seeded=${seeded}" >> "${GITHUB_OUTPUT}"

      - name: Check out the control plane from the default branch
        if: ${{ inputs.loop_enabled == 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          path: control

      - name: Check out the integration branch
        if: ${{ inputs.loop_enabled == 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: autonomous/lab
          fetch-depth: 1
          path: lab

      - name: Release work left in flight
        id: release
        if: ${{ inputs.loop_enabled == 'false' }}
        run: |
          set -euo pipefail
          ids=$(jq -r '.tasks[] | select(.status == "in_progress") | .id' lab/agent_tasks.json)
          if [ -z "${ids}" ]; then
            echo "No task is in flight."
            echo "released=0" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          count=0
          for id in ${ids}; do
            python3 control/scripts/autonomous/task_lifecycle.py --manifest lab/agent_tasks.json --action complete --task-id "${id}" --outcome stale --note "the owner switched the loop off"
            count=$((count + 1))
          done
          python3 control/scripts/autonomous/validate_tasks.py lab/agent_tasks.json
          echo "released=${count}" >> "${GITHUB_OUTPUT}"
          cd lab
          if git diff --quiet -- agent_tasks.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent_tasks.json
          git commit -m "chore(autonomous): release in-flight tasks after the loop was switched off"
          git push origin "HEAD:${INTEGRATION_BRANCH}"

      - name: Summary
        env:
          BRANCH_CREATED: ${{ steps.prepare.outputs.created }}
          QUEUE_SEEDED: ${{ steps.prepare.outputs.seeded }}
          RELEASED: ${{ steps.release.outputs.released }}
        run: |
          {
            echo "### Autonomous loop switch"
            echo ""
            echo "- JULES_LOOP_ENABLED: ${LOOP_ENABLED}"
            echo "- Integration branch: ${INTEGRATION_BRANCH} (created now: ${BRANCH_CREATED:-skipped}, queue seeded now: ${QUEUE_SEEDED:-skipped})"
            echo "- Control plane: always read from ${DEFAULT_BRANCH}, so the integration branch only carries agent_tasks.json"
            echo "- Release automation: disabled by policy, human-gated"
            if [ "${LOOP_ENABLED}" = "false" ]; then
              echo "- Tasks released back to the queue: ${RELEASED:-0}"
              echo ""
              echo "**The switch stops new dispatches only.** A worker session that is already running is not cancelled by it, because the worker API documents no cancel operation. Stop such a session in the Jules UI if you need it stopped now; any pull request it still opens will not be merged while the loop is off."
            else
              echo ""
              echo "Before relying on unattended merges, protect ${INTEGRATION_BRANCH} and require the checks **Quality Gate** and **Autonomous Evidence Gate**. Without server-side protection, the merge guards are only enforced by the workflow that performs the merge."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
