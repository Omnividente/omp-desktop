name: Autonomous Control CI

# Self-tests for the autonomous control plane.
#
# Unit tests alone were not enough: a green suite once coexisted with a merge
# path that could land a commit nobody verified. The assertions below check the
# execution chain in the workflows themselves - that the merge is bound to the
# commit CI verified, that the evidence gate is consulted, that policy code is
# read from the default branch, and that nothing here can release.

on:
  pull_request:
    paths:
      - autonomous-project.json
      - agent_tasks.json
      - scripts/autonomous/**
      - docs/autonomous/**
      - .github/workflows/autonomous_*.yml
  push:
    branches:
      - main
      - autonomous/lab
    paths:
      - autonomous-project.json
      - agent_tasks.json
      - scripts/autonomous/**
      - docs/autonomous/**
      - .github/workflows/autonomous_*.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-plane:
    name: Validate the autonomous control plane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile control-plane scripts
        run: python3 -m py_compile scripts/autonomous/*.py

      - name: Run control-plane unit tests
        run: |
          set -uo pipefail
          status=0
          for test in scripts/autonomous/*_test.py; do
            echo "== ${test}"
            python3 "${test}" || status=1
          done
          exit "${status}"

      - name: Validate configuration and task queue
        run: |
          set -euo pipefail
          python3 -c "import json; json.load(open('autonomous-project.json', encoding='utf-8'))"
          python3 scripts/autonomous/verify_policy.py --config autonomous-project.json --integration-branch autonomous/lab
          python3 scripts/autonomous/validate_tasks.py agent_tasks.json

      - name: Parse every autonomous workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import sys
          try:
              import yaml
          except ImportError:
              print("PyYAML is unavailable; skipping the parse check.")
              sys.exit(0)
          for path in sorted(glob.glob(".github/workflows/autonomous_*.yml")):
              with open(path, encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print("parsed " + path)
          PY

      - name: Assert the loop contains no release automation
        run: |
          set -uo pipefail
          files=$(ls .github/workflows/autonomous_*.yml | grep -v '/autonomous_control_ci.yml$')
          if grep -En "action-gh-release|gh release|git tag|npm version|cargo release|tauri-action|softprops" $files; then
            echo "::error::Autonomous workflows must never create releases, tags, or version bumps."
            exit 1
          fi
          echo "No release automation found in the autonomous workflows."

      - name: Assert the loop never targets the default branch
        run: |
          set -uo pipefail
          files=$(ls .github/workflows/autonomous_*.yml | grep -v '/autonomous_control_ci.yml$')
          if grep -En "pr merge .*--base main|HEAD:main|:refs/heads/main" $files; then
            echo "::error::Autonomous workflows must never push or merge into the default branch."
            exit 1
          fi
          echo "No default-branch writes found in the autonomous workflows."

      - name: Assert automerge only ever merges the commit CI verified
        run: |
          set -uo pipefail
          file=.github/workflows/autonomous_automerge.yml
          merges=$(grep -n 'gh pr merge' "${file}")
          if [ -z "${merges}" ]; then
            echo "::error::No merge command found in ${file}."
            exit 1
          fi
          if echo "${merges}" | grep -vF -- '--match-head-commit "${CI_SHA}"'; then
            echo "::error::Every merge must be bound to the commit Quality Gate verified."
            exit 1
          fi
          if grep -nF -- '--match-head-commit "${head_oid}"' "${file}"; then
            echo "::error::The merge must not re-read the pull request head; it would allow an unverified revision to land."
            exit 1
          fi
          if ! grep -qF -- '--ci-sha "${CI_SHA}"' "${file}"; then
            echo "::error::The scope decision must be taken for the verified commit."
            exit 1
          fi
          if ! grep -qF -- 'compare/${INTEGRATION_BRANCH}...${CI_SHA}' "${file}"; then
            echo "::error::The changed-file list must be derived from the verified commit."
            exit 1
          fi
          echo "Automerge is bound to a single verified revision."

      - name: Assert the fix-evidence gate exists and is consulted
        run: |
          set -uo pipefail
          gate=.github/workflows/autonomous_evidence_gate.yml
          if [ ! -f "${gate}" ]; then
            echo "::error::${gate} is missing; automerge would have no proof that a fix fixes anything."
            exit 1
          fi
          name=$(jq -r '.merge_gate.evidence_check_name // ""' autonomous-project.json)
          if [ -z "${name}" ]; then
            echo "::error::merge_gate.evidence_check_name is not configured."
            exit 1
          fi
          if ! grep -qF "name: ${name}" "${gate}"; then
            echo "::error::The evidence gate job must be named '${name}' so automerge can find its check run."
            exit 1
          fi
          if ! grep -qF -- '--evidence-state' .github/workflows/autonomous_automerge.yml; then
            echo "::error::Automerge must consult the evidence gate."
            exit 1
          fi
          echo "The evidence gate is wired to automerge as '${name}'."

      - name: Assert policy code is read from the default branch
        run: |
          set -uo pipefail
          files=$(ls .github/workflows/autonomous_*.yml | grep -v '/autonomous_control_ci.yml$')
          if grep -nE 'lab/scripts/autonomous|lab/autonomous-project.json' $files; then
            echo "::error::Policy scripts and configuration must come from the default branch, never from the integration branch."
            exit 1
          fi
          for file in $files; do
            if ! grep -q 'ref: main' "${file}"; then
              echo "::error::${file} does not check out the control plane from main."
              exit 1
            fi
          done
          echo "Every loop workflow reads its control plane from main."

      - name: Assert the task lifecycle is actually driven
        run: |
          set -uo pipefail
          file=.github/workflows/autonomous_next_task.yml
          for action in 'close-from-pr' 'reconcile' '--action start' 'import_discovery_tasks.py'; do
            if ! grep -qF -- "${action}" "${file}"; then
              echo "::error::${file} must drive '${action}', otherwise finished work is never closed and discovery repeats forever."
              exit 1
            fi
          done
          echo "The task lifecycle is driven end to end."
