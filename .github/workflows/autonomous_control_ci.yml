name: Autonomous Control CI

# Self-tests for the autonomous control plane.
#
# Run executable policy, queue and manual-proposal regressions. State-store
# checks use disposable Git repositories, never the live laboratory queue.

on:
  pull_request:
    paths:
      - autonomous-project.json
      - agent_tasks.json
      - scripts/autonomous/**
      - docs/autonomous/**
      - .github/workflows/autonomous_*.yml
  push:
    branches:
      - main
      - autonomous/lab
    paths:
      - autonomous-project.json
      - agent_tasks.json
      - scripts/autonomous/**
      - docs/autonomous/**
      - .github/workflows/autonomous_*.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-plane:
    name: Validate the autonomous control plane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: control
    steps:
      - name: Check out the control plane revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Lab carries entry points, not control scripts. PRs into main must
          # still test their own control-plane changes, not the old main code.
          ref: ${{ (github.base_ref == 'autonomous/lab' || github.ref == 'refs/heads/autonomous/lab') && 'main' || github.sha }}
          path: control

      - name: Check out the revision under validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: lab

      - name: Compile control-plane scripts
        run: python3 -m py_compile scripts/autonomous/*.py

      - name: Run control-plane unit tests
        run: |
          set -uo pipefail
          status=0
          for test in scripts/autonomous/*_test.py; do
            echo "== ${test}"
            python3 "${test}" || status=1
          done
          exit "${status}"

      - name: Validate configuration and task queue
        run: |
          set -euo pipefail
          python3 -c "import json; json.load(open('autonomous-project.json', encoding='utf-8'))"
          python3 scripts/autonomous/verify_policy.py --config autonomous-project.json --integration-branch autonomous/lab
          # Product copy is an immutable migration seed; active state is separate.
          python3 scripts/autonomous/validate_tasks.py ../lab/agent_tasks.json

      - name: Parse every autonomous workflow
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          python3 - <<'PY'
          import glob
          import yaml
          for path in sorted(glob.glob("../lab/.github/workflows/autonomous_*.yml")):
              with open(path, encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print("parsed " + path)
          PY
